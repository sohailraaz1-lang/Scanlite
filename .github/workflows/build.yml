name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q scanlite.zip -d unpacked
          PUB=$(find unpacked -name pubspec.yaml | head -1)
          echo "PROJ_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate Android project with current templates
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          mkdir -p /tmp/keep
          cp android/app/src/main/AndroidManifest.xml /tmp/keep/
          cp -r android/app/src/main/res /tmp/keep/res
          rm -rf android
          flutter create --platforms=android --org com.scanlite --project-name scanlite .
          cp /tmp/keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/keep/res/. android/app/src/main/res/
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.png
          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/scanlite/app
          printf 'package com.scanlite.app\n\nimport io.flutter.embedding.android.FlutterFragmentActivity\n\nclass MainActivity : FlutterFragmentActivity()\n' > android/app/src/main/kotlin/com/scanlite/app/MainActivity.kt
          sed -i 's/applicationId = ".*"/applicationId = "com.scanlite.app"/' android/app/build.gradle* || true
          sed -i 's/namespace = ".*"/namespace = "com.scanlite.app"/' android/app/build.gradle* || true

      - name: Packages
        working-directory: ${{ env.PROJ_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJ_DIR }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: scanlite-apk
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk
